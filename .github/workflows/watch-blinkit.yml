name: Watch (Blinkit)

# Hourly. Blinkit needs a real Chromium session for its location-scoped
# catalogue, so a run costs a browser download plus page loads - far too heavy
# for a 5-minute cadence, and quick-commerce stock does not move that fast.
on:
  schedule:
    - cron: "7 * * * *"   # offset from :00 so it does not collide with the fast job
  workflow_dispatch:

concurrency:
  group: watch-blinkit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/hotwheels.db
          key: diecast-db-${{ github.run_id }}
          restore-keys: diecast-db-

      - name: Scrape Blinkit
        env:
          HOTWHEELS_DB: data/hotwheels.db
        run: python cli.py scrape --only blinkit

      - name: Send alerts
        env:
          HOTWHEELS_DB: data/hotwheels.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python cli.py alerts

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/hotwheels.db
          key: diecast-db-${{ github.run_id }}
