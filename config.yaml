# Hot Wheels unified price dashboard - configuration

region:
  label: "VIT Chennai"
  pincode: "600127"
  city: "Chennai"
  # Coordinates the quick-commerce adapters use to set a delivery location.
  # Do not edit by hand - use `python cli.py region set <city|pincode>`,
  # or the region picker in the dashboard header.
  lat: 12.8406
  lon: 80.1534

# Hard ceiling, applied at parse time. `null` means no ceiling: every price is
# kept, however dear, and filtering by price becomes purely a dashboard choice.
max_price: null
currency: "INR"

# Mainlines only. A casting with no real-world marque or model behind it is
# fantasy (Twin Mill, Bone Shaker, and every no-name shape); those are dropped
# rather than stored. Multipacks and track sets are never judged either way -
# a 5-pack mixes both kinds - so they are always kept.
exclude_fantasy: true

# How far above its class an item may be priced and still be worth alerting
# about. A shop's stated MRP is useless here - 372 of 374 listings sit at or
# under their own, because shops set MRP to whatever they charge - so the
# baseline is the median price of everything sharing a (brand, series, pack
# size). Hot Wheels mainline singles cluster on Rs 179, so 0.25 alerts up to
# about Rs 224 and rejects Rs 358. Set to null to alert at any price.
max_markup: 0.25

# Search terms fanned out to every enabled source. The scrapers only find what
# they search for, so every tracked brand needs its own terms. Results are
# filtered again on arrival: brand must be recognised AND the scale must be
# 1:64-class, so a Maisto 1:24 hit here is discarded before it is stored.
# The full sweep. Thorough, and slow enough that it is not what you poll for a
# restock - see `fast_queries`.
queries:
  # Hot Wheels
  - "hot wheels"
  - "hot wheels set"
  - "hot wheels track set"
  - "hot wheels 5 pack"
  - "hot wheels premium"
  - "hot wheels monster trucks"
  # Matchbox
  - "matchbox car"
  - "matchbox 1:64"
  - "matchbox 5 pack"
  # Majorette
  - "majorette car"
  - "majorette 1:64"
  - "majorette gift pack"
  # Other 1:64 collector brands
  - "tomica car"
  - "mini gt 1:64"
  - "m2 machines 1:64"
  - "greenlight 1:64"
  - "auto world 1:64"
  - "johnny lightning 1:64"
  - "tarmac works 1:64"
  - "maisto 1:64"
  - "bburago 1:64"
  # Sets specifically
  - "diecast car set 1:64"
  - "1:64 diecast track set"

# The subset polled on the fast cycle. A restock reaches you at the speed of
# this list, so it holds only the brands actually watched - the long tail of
# collector marques is found by the full sweep a few times an hour.
fast_queries:
  - "hot wheels"
  - "matchbox"
  - "majorette"

# Shops polled on the fast cycle: the ones that actually stock mainlines at or
# near MRP, so a restock there is something you would buy. The rest are found
# by the full sweep. Leave empty to poll every enabled shop.
fast_sources:
  - firstcry
  - toymarche
  - funcorp
  - kinderlogs
  - krazycaterpillar
  - giftgalaxy
  - itsfun
  - zoomsters
  - blueballoon
  - crossword

sources:
  amazon_in:
    enabled: false
    max_pages: 3
  flipkart:
    enabled: false
    max_pages: 3
  firstcry:
    enabled: true
    # 20 products per page; Hot Wheels alone is ~290, so 15 covers it.
    max_pages: 15
  blinkit:
    enabled: true
  instamart:
    enabled: false
  zepto:
    enabled: false

  # Specialty and general shops running on Shopify. Every Shopify store exposes
  # /products.json and /search/suggest.json, so one adapter serves them all and
  # adding a shop is a line here - no new scraper.
  #
  #   mode: catalog  read the whole catalogue and filter locally. Right for a
  #                  small specialist: complete, and one request per 250 items.
  #   mode: search   run the configured queries. Right for a big general
  #                  retailer, where paging the catalogue means 40,000 books.
  shopify:
    enabled: true
    mode: catalog
    max_pages: 6
    stores:
      - name: kinderlogs
        label: "Kinder Logs"
        domain: kinderlogs.in
        enabled: true
      - name: itsfun
        label: "ItsFun"
        domain: itsfun.in
        enabled: true
      - name: zoomsters
        label: "Zoomsters"
        domain: zoomsters.in
        enabled: true
      - name: blueballoon
        label: "Blue Balloon Toys"
        domain: blueballoontoys.com
        enabled: true
      - name: giftgalaxy
        label: "Gift Galaxy"
        domain: giftgalaxy.in
        enabled: true
      - name: peppystore
        label: "The Peppy Store"
        domain: thepeppystore.in
        enabled: true
      - name: toycollectors
        label: "Toy Collectors India"
        domain: toycollectorsindia.com
        enabled: false          # dead: SSL certificate verify failed
      - name: kidsinfy
        label: "Kidsinfy"
        domain: kidsinfy.in
        enabled: true
      # General toy retailers: their catalogues are mostly not diecast, so
      # search a few terms rather than paging thousands of unrelated products.
      - name: funcorp
        label: "FunCorp"
        domain: funcorp.in
        enabled: true
        mode: search
      - name: toysindia
        label: "Toys India"
        domain: toys-india.com
        enabled: true
        mode: search
      - name: toycra
        label: "Toycra"
        domain: toycra.com
        enabled: true
        mode: search
      - name: krazycaterpillar
        label: "Krazy Caterpillar"
        domain: krazycaterpillar.com
        enabled: true
        mode: search
      - name: toymarche
        label: "Toymarche"
        domain: toymarche.com
        enabled: true
        mode: search
      - name: jaimantoys
        label: "Jaiman Toys"
        domain: jaimantoys.com
        enabled: true
        mode: search
      - name: crossword
        label: "Crossword"
        domain: crossword.in
        enabled: true
        mode: search          # a bookshop; searching beats paging the catalogue
      - name: bigsmall
        label: "Bigsmall"
        domain: bigsmall.in
        enabled: true
        mode: search

  # WooCommerce shops expose a public Store API at /wp-json/wc/store/v1.
  woocommerce:
    enabled: true
    per_page: 50
    stores:
      - name: planetsuperheroes
        label: "Planet Superheroes"
        domain: planetsuperheroes.com
        enabled: false          # answers, but stocks no diecast
      - name: thetoysindia
        label: "The Toys India"
        domain: thetoysindia.com
        enabled: false          # dead: no DNS
      - name: gbuy
        label: "Gbuy"
        domain: gbuy.in
        enabled: true

# Stores with no public product API - they run custom platforms, so the generic
# Shopify/WooCommerce adapters cannot reach them. Each needs a bespoke HTML
# scraper like Amazon's:
#   karzanddolls.com     custom PHP storefront
#   toyworldjaipur.in    custom, no recognisable platform

scrape:
  # Polite delay between page fetches, seconds. These are mostly JSON API
  # calls, not HTML scraping, and shops run concurrently - so this is the
  # single biggest lever on how quickly a restock reaches you.
  delay: 0.5
  timeout: 30
  # Fuzzy-match threshold (0-100) for grouping listings into one product.
  match_threshold: 87
  headless: true

database: "hotwheels.db"
